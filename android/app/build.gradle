plugins { id 'com.android.application' }
android {
    namespace 'com.jackanalyzer.pantau'
    compileSdk 34
    defaultConfig {
        applicationId 'com.jackanalyzer.pantau'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // APK peribadi (sideload), bukan Play Store
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
