async function muat() {
  if (!TOKEN) return loginView();
  $('#bOut').hidden = false; $('#bRef').hidden = false;
  if (!P && !K) $('#app').innerHTML = '<div class="card dim">memuat...</div>';
  if (PERANAN !== 'ADMIN') return muatClient();

  const sesi = v => v.status === 'fulfilled' && v.value && v.value.ok === false && /sesi|admin/i.test(v.value.msg || '');
  if (sesi(rk)) { TOKEN = null; ls.del('jp_token'); P = K = null; return loginView(rk.value.msg); }
  if (rp.status === 'fulfilled' && rp.value && rp.value.ok) { P = rp.value; ralatP = null; }
  else if (rp.status === 'rejected' && rp.reason && rp.reason.code === 404) ralatP = 'Jack Pantau belum aktif di server: jalankan UI\\supabase\\16_pantau.sql dalam Supabase SQL Editor, kemudian restart app PC.';
  if (rk.status === 'fulfilled' && rk.value && rk.value.ok) K = rk.value;
  if (rr.status === 'fulfilled' && rr.value && rr.value.ok) { const m = {}; (rr.value.perintah || []).forEach(p => { if (!m[p.ahli_id]) m[p.ahli_id] = p; }); for (const k in m) PR[k] = m[k]; }
  if (P || K || ralatP) { tAmbil = Date.now(); lukis(); }
  else $('#app').innerHTML = '<div class="card r">Gagal ambil data. Semak internet, tekan ⟳.</div>';
  $('#umur').textContent = tAmbil ? new Date(tAmbil).toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' }) : '';
  clearTimeout(timer); timer = setTimeout(muat, SEGAR_S * 1000);
}
async function muatClient() {   // v1.2: client = akaun sendiri sahaja (SQL 17 pantau_saya / perintah_saya_status)

  else if (rp.status === 'rejected' && rp.reason && rp.reason.code === 404) ralatP = 'Pantau telefon untuk client belum diaktifkan oleh admin. Cuba lagi nanti.';
  if (rs.status === 'fulfilled' && rs.value && rs.value.ok) PRS = rs.value.perintah;

  clearTimeout(timer); timer = setTimeout(muat, SEGAR_S * 1000);
}
